name: Daily DB Backup

on:
  schedule:
    - cron: '0 10 * * *'  # 10 AM UTC = 2 AM Pacific (after the previous day's work ends)
  workflow_dispatch:        # allows manual trigger from GitHub Actions tab

# NOTE: backups are uploaded to a private Supabase Storage bucket, never
# committed to git. This repo is public (Vercel Hobby-tier collaboration
# limitation across two separate Hobby accounts sharing one GitHub login),
# so real customer data must never land in git history here.

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Ubuntu's default apt repo ships an older pg_dump (currently 16.x) than
      # Supabase's Postgres 17 — pg_dump refuses to dump from a newer server
      # by default. Pull postgresql-client-17 from the official PGDG repo
      # instead so the client version always matches or exceeds the server.
      - name: Install postgresql-client 17
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          # Belt-and-suspenders: don't rely on Debian's alternatives system
          # having repointed the unversioned `pg_dump` symlink at the new
          # install. Confirm the v17 binary is actually present and log both
          # versions so a future mismatch is obvious in the run log instead
          # of silently resolving to whichever one `pg_dump` happens to mean.
          test -x /usr/lib/postgresql/17/bin/pg_dump
          echo "Unversioned pg_dump: $(pg_dump --version)"
          echo "PGDG v17 pg_dump:    $(/usr/lib/postgresql/17/bin/pg_dump --version)"

      - name: Run pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          TIMESTAMP=$(date +%Y-%m-%d)
          FILENAME="caliber-$TIMESTAMP.sql.gz"
          FILE="backups/$FILENAME"

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set."
            exit 1
          fi

          # Call the v17 binary by its explicit path rather than the bare
          # `pg_dump` on PATH — Ubuntu's alternatives symlink doesn't
          # reliably switch to the newly installed version.
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-acl | gzip > "$FILE"

          # With pipefail above, a pg_dump failure already aborts this step —
          # but also guard against a "successful" dump that's suspiciously
          # small (e.g. connected to the wrong/empty database), so a bad file
          # never gets uploaded silently.
          SIZE=$(stat -c%s "$FILE")
          echo "Dump size: $SIZE bytes"
          if [ "$SIZE" -lt 2048 ]; then
            echo "::error::pg_dump output is only $SIZE bytes — looks empty/broken. Not uploading."
            exit 1
          fi

          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          echo "FILEPATH=$FILE" >> "$GITHUB_ENV"

      - name: Upload to Supabase Storage (private bucket — never touches git)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY secrets are not set."
            exit 1
          fi
          curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/storage/v1/object/db-backups/$FILENAME" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/gzip" \
            -H "x-upsert: true" \
            --data-binary "@$FILEPATH"
          echo "Uploaded $FILENAME to Supabase Storage (db-backups bucket)."

      - name: Prune old SQL backups (keep newest 30)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          ALL=$(curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/storage/v1/object/list/db-backups" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix": "caliber-", "limit": 1000, "sortBy": {"column":"name","order":"desc"}}')
          TO_DELETE=$(echo "$ALL" | jq -c '[.[] | select(.name != null)] | .[30:] | map(.name)')
          COUNT=$(echo "$TO_DELETE" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            curl -sS --fail-with-body -X DELETE \
              "$SUPABASE_URL/storage/v1/object/db-backups" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"prefixes\": $TO_DELETE}"
            echo "Pruned $COUNT old backup(s): $TO_DELETE"
          else
            echo "Nothing to prune ($COUNT files beyond retention)."
          fi
